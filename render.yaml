services:
  # --- Backend API (FastAPI) ---
  - type: web
    name: ai-support-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: ai-support-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DEBUG
        value: "False"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: LLM_PROVIDER
        value: openai
      # Set these in the Render dashboard (Environment tab) - never commit
      # real keys to this file. Only the provider matching LLM_PROVIDER
      # needs a real value; the others can stay unset.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # sync: false so a Blueprint re-sync never overwrites your real
      # frontend URL back to this placeholder. Set the real value once in
      # the Render dashboard (Environment tab) after the frontend's first
      # deploy - comma-separate multiple origins, e.g.
      # "https://a.onrender.com,https://app.example.com".
      - key: ALLOWED_ORIGINS
        sync: false

  # --- Frontend (static Vite build) ---
  - type: web
    name: ai-support-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # sync: false so a Blueprint re-sync never overwrites your real
      # backend URL back to this placeholder. Set the real value once in
      # the Render dashboard (Environment tab) after the backend's first
      # deploy, then trigger a manual redeploy of this service - Vite
      # bakes env vars in at build time, so a restart alone won't pick up
      # a later change.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # React Router uses client-side routing; without this, refreshing on
      # e.g. /chat or /documents returns a 404 from the static host.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free Render Postgres instances expire after 30 days and must be
  # recreated/upgraded to persist data long-term - see DEPLOY.md.
  - name: ai-support-db
    plan: free
    databaseName: ai_support
    user: ai_support
