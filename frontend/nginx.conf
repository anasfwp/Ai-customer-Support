server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Let server-sent events through token by token
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 11m;
    }

    location / {
        try_files $uri /index.html;
    }
}
